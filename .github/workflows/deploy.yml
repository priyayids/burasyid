name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-burasyid
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static site via rsync to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -az --delete --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null" \
            index.html css js deploy@187.77.126.196:/srv/burasyid-demo/

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.77.126.196
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            ls -la /srv/burasyid-demo/
            curl -s -o /dev/null -w "origin http: %{http_code}\n" -H "Host: burasyidcateringdemo.priyayidev.my.id" http://127.0.0.1/
            echo "Deployment to /srv/burasyid-demo complete."
